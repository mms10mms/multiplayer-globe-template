<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>2D Intel Map</title>
		
		<!-- Leaflet CSS for 2D Map Rendering -->
		<link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
		
		<style>
			/* Reset margins and make the map take up the full screen */
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #0a0a0f;
				overflow: hidden;
				font-family: 'Courier New', Courier, monospace;
			}
			#map {
				width: 100%;
				height: 100%;
				z-index: 1;
			}
			/* Styling the custom navigation bar over the map */
			.map-nav {
				position: fixed;
				top: 20px;
				left: 20px;
				z-index: 9999;
			}
			.nav-link {
				color: #ff4a4a;
				text-decoration: none;
				font-size: 12px;
				font-weight: bold;
				background: rgba(10, 10, 15, 0.85);
				border: 1px solid rgba(255, 74, 74, 0.4);
				padding: 8px 16px;
				border-radius: 4px;
				box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
				transition: all 0.2s ease;
			}
			.nav-link:hover {
				background: #ff4a4a;
				color: #0a0a0f;
				box-shadow: 0 0 15px #ff4a4a;
				border-color: #ff4a4a;
				cursor: pointer;
			}
		</style>
	</head>
	<body>

		<!-- Overlapping Navigation Link back to home -->
		<div class="map-nav">
			<a class="nav-link" href="/index.html">[RETURN_HOME]</a>
		</div>

		<!-- Target Container element where the 2D map will load -->
		<div id="map"></div>

		<!-- Leaflet JavaScript library -->
		<script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

		<script>
			// 1. Initialize the 2D map canvas and point it to coordinates [0, 0] (center of the world)
				const map = L.map('map').setView([0, 0], 2);

			// 2. Load map tiles (We use CartoDB Dark Matter tiles to keep your dark/cyber theme)
			L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
				attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors &copy; <a href="https://carto.com">CARTO</a>',
				subdomains: 'abcd',
				maxZoom: 20
			}).addTo(map);

			// 3. Optional: Add a sample interactive marker onto the map
			const sampleMarker = L.marker([51.505, -0.09]).addTo(map);
			sampleMarker.bindPopup("<b style='color:#0a0a0f;'>Target Location</b><br><span style='color:#ff4a4a;'>Node Active.</span>").openPopup();
		</script>
	</body>
</html>
