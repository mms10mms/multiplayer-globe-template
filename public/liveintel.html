<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
		<title>2D Intel Map</title>
		
		<!-- Leaflet CSS for 2D Map Drawing -->
		<link rel="stylesheet" href="https://unpkg.com" />
		
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #0a0a0f;
				overflow: hidden;
				font-family: monospace;
			}
			/* The map container MUST have an explicit height and width to render */
			#map {
				width: 100%;
				height: 100vh;
				background: #0a0a0f;
				z-index: 1;
			}
			.map-nav {
				position: fixed;
				top: 20px;
				left: 20px;
				z-index: 9999;
			}
			.nav-link {
				color: #ff4a4a;
				text-decoration: none;
				font-size: 12px;
				font-weight: bold;
				background: rgba(10, 10, 15, 0.9);
				border: 1px solid #ff4a4a;
				padding: 8px 16px;
				border-radius: 4px;
			}
		</style>
	</head>
	<body>

		<div class="map-nav">
			<a class="nav-link" href="/index.html">[RETURN_HOME]</a>
		</div>

		<!-- This is the box where the map draws itself -->
		<div id="map"></div>

		<!-- Leaflet JavaScript library -->
		<script src="https://unpkg.com"></script>

		<script>
			// Make sure the script runs only after the full page loads
			window.addEventListener('DOMContentLoaded', () => {
				try {
					// 1. Initialize map pointing to London coordinates [51.5, -0.09] at zoom level 3
					const map = L.map('map').setView([51.5, -0.09], 3);

					// 2. Load Dark Cyber style map tiles
					L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
						attribution: '&copy; OpenStreetMap &copy; CARTO',
						subdomains: 'abcd',
						maxZoom: 20
					}).addTo(map);

					// 3. Add a test pin marker
					L.marker([51.5, -0.09])
						.addTo(map)
						.bindPopup("<b style='color:#000;'>Node Online</b>")
						.openPopup();
						
				} catch (error) {
					console.error("Map initialization failed: ", error);
				}
			});
		</script>
	</body>
</html>
