<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Globe</title>
		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<!-- Primary Meta Tags -->
		<meta name="title" content="PartyServer" />
		<meta name="description" content="Everything's better with friends!" />
		<meta name="author" content="PartyServer" />
		<!-- Theme Colour -->
		<meta name="theme-color" content="#ffffff" />

		<link rel="stylesheet" href="/normalize.css" />
		<link rel="stylesheet" href="/dist/index.css" />
	</head>
	<body>
		<div id="root">Loading...</div>
		<script type="module" src="/dist/index.js"></script>

		<!-- Cyberpunk Terminal Style CVE Randomizer Box -->
		<div id="cve-widget" style="position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: rgba(10, 10, 14, 0.95); color: #00ff66; text-align: center; font-family: 'Courier New', Courier, monospace; font-size: 13px; border: 1px solid #ff4a4a; border-radius: 4px; box-shadow: 0 0 20px rgba(255, 74, 74, 0.2), inset 0 0 10px rgba(0, 255, 102, 0.05); width: 90%; max-width: 900px; z-index: 9999; backdrop-filter: blur(4px);">
			
			<!-- CRT Scanline Overlay Animation effect -->
			<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 6px 100%; pointer-events: none; opacity: 0.4;"></div>

			<div style="margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 2;">
				<strong style="letter-spacing: 1px; color: #ff4a4a; text-shadow: 0 0 5px rgba(255, 74, 74, 0.5);">[SLAUGHTER_SEC@CORE]:~$ FETCH_VULN</strong> 
				<span id="cve-id" style="color: #00ff66; font-weight: 700; background: rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.3); padding: 2px 10px; border-radius: 3px; text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);">SYS_INIT</span>
				<button onclick="manualRoll()" style="background: #1a1a24; border: 1px solid #ff4a4a; color: #ff4a4a; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: bold; padding: 4px 12px; border-radius: 3px; box-shadow: 0 0 5px rgba(255, 74, 74, 0.1); transition: all 0.2s ease;" onmouseover="this.style.background='#ff4a4a'; this.style.color='#0a0a0e'; this.style.boxShadow='0 0 10px #ff4a4a';" onmouseout="this.style.background='#1a1a24'; this.style.color='#ff4a4a'; this.style.boxShadow='none';">EXECUTE_ROLL ↻</button>
			</div>
			<p id="cve-summary" style="margin: 0; font-size: 12px; color: #88ffaa; line-height: 1.6; min-height: 36px; max-height: 60px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 3px; border: 1px solid rgba(0, 255, 102, 0.1); position: relative; z-index: 2; font-weight: 500;"></p>
		</div>

		<!-- Script to handle automated 15-second tracking and async fetches -->
		<script>
			let cycleTimer = null;

			async function loadRandomCve() {
				try {
					document.getElementById('cve-id').textContent = "ROLLING...";
					document.getElementById('cve-summary').textContent = "Connecting to intelligence matrices...";
					
					const response = await fetch('/api/cve'); 
					if (!response.ok) throw new Error();
					
					const data = await response.json();
					
					// Formats terminal view and inserts hyperlink to official NVD matrix
					document.getElementById('cve-id').innerHTML = `<a href="https://nist.gov{data.id}" target="_blank" style="color: #00ff66; text-decoration: none; border-bottom: 1px dotted #00ff66;">${data.id}</a>`;
					document.getElementById('cve-summary').textContent = `> DESCRIPTION: ${data.summary}`;
				} catch (error) {
					document.getElementById('cve-id').textContent = "ERR_FAIL";
					document.getElementById('cve-summary').textContent = "> CRITICAL: Failed to poll intelligence streaming matrix network infrastructure.";
				}
			}

			// Automatically auto-cycles data array entries every 15000 milliseconds (15 seconds)
			function startAutoCycle() {
				clearInterval(cycleTimer);
				cycleTimer = setInterval(loadRandomCve, 15000);
			}

			// Resets intervals safely if a user chooses to force a manual skip command
			function manualRoll() {
				loadRandomCve();
				startAutoCycle();
			}

			window.addEventListener('DOMContentLoaded', () => {
				loadRandomCve();
				startAutoCycle();
			});
		</script>
	</body>
</html>
