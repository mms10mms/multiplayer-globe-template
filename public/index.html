<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Globe</title>
		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<!-- Primary Meta Tags -->
		<meta name="title" content="PartyServer" />
		<meta name="description" content="Everything's better with friends!" />
		<meta name="author" content="PartyServer" />
		<!-- Theme Colour -->
		<meta name="theme-color" content="#ffffff" />

		<link rel="stylesheet" href="/normalize.css" />
		<link rel="stylesheet" href="/dist/index.css" />
	</head>
	<body>
		<div id="root">Loading...</div>
		<script type="module" src="/dist/index.js"></script>

		<!-- Terminal Tracking and Self-Contained Dataset Engine -->
		<script>
			let cycleTimer = null;

			// Localized Cyber Intelligence Array Matrix (Exactly 15 High-Profile Real CVEs)
			const cveDataset = [
				{ id: "CVE-2024-3094", summary: "Malicious code injection discovered in XZ Utils compression utilities, leading to remote execution shell backdoors." },
				{ id: "CVE-2021-44228", summary: "Apache Log4j2 JNDI configurations vulnerable to message lookup substitution attacks permitting remote execution strings." },
				{ id: "CVE-2023-38606", summary: "Apple iOS kernel verification bypass exploit allowing localized processes to execute unauthorized root privileges." },
				{ id: "CVE-2017-0144", summary: "Remote code execution flaw in Microsoft SMBv1 servers, heavily leveraged by WannaCry via EternalBlue mechanisms." },
				{ id: "CVE-2022-22965", summary: "Spring Framework Core feature sets vulnerable to remote data binding injection routines via specific JVM environments." },
				{ id: "CVE-2020-0601", summary: "Windows CryptoAPI spoofing vulnerability allowing attackers to bypass system security validation to trust malicious certificates." },
				{ id: "CVE-2014-0160", summary: "OpenSSL Heartbeat Extension information disclosure flaw permitting unauthenticated memory dumping routines (Heartbleed)." },
				{ id: "CVE-2019-0708", summary: "Remote code execution vulnerability inside Windows Remote Desktop Services (RDS) architecture via pre-auth states (BlueKeep)." },
				{ id: "CVE-2021-34527", summary: "Windows Print Spooler service failure allowing remote code execution via unauthorized driver updates (PrintNightmare)." },
				{ id: "CVE-2020-1472", summary: "Elevation of privilege vulnerability mapping inside Microsoft Netlogon protocol validation parameters (Netlogon Exploitation)." },
				{ id: "CVE-2018-7600", summary: "Drupal core remote code execution vulnerability triggered via improper input sanitation on rendering structures (Drupalgeddon2)." },
				{ id: "CVE-2023-23397", summary: "Microsoft Outlook privilege escalation flaw letting remote actors pass NTLM authentication hashes silently via calendar alerts." },
				{ id: "CVE-2022-26134", summary: "Atlassian Confluence Server unauthenticated OGNL expression injection leading to absolute remote root shell execution." },
				{ id: "CVE-2021-26855", summary: "Microsoft Exchange Server SSRF vulnerability permitting untrusted attackers to bypass proxy parameters (ProxyLogon Core)." },
				{ id: "CVE-2020-5902", summary: "F5 BIG-IP Traffic Management User Interface command execution flaw permitting complete root administrative system compromise." }
			];

			// 1. Dynamic DOM Builder mapping directly above layout layers
			function buildTerminalWidget() {
				if (document.getElementById('cve-widget')) return;

				const widget = document.createElement('div');
				widget.id = 'cve-widget';
				widget.style.cssText = "position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: rgba(10, 10, 14, 0.95); color: #00ff66; text-align: center; font-family: 'Courier New', Courier, monospace; font-size: 13px; border: 1px solid #ff4a4a; border-radius: 4px; box-shadow: 0 0 20px rgba(255, 74, 74, 0.2), inset 0 0 10px rgba(0, 255, 102, 0.05); width: 90%; max-width: 900px; z-index: 9999; backdrop-filter: blur(4px);";

				const scanline = document.createElement('div');
				scanline.style.cssText = "position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 6px 100%; pointer-events: none; opacity: 0.4;";
				widget.appendChild(scanline);

				const contentContainer = document.createElement('div');
				contentContainer.style.cssText = "margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 2;";
				
				const promptTitle = document.createElement('strong');
				promptTitle.style.cssText = "letter-spacing: 1px; color: #ff4a4a; text-shadow: 0 0 5px rgba(255, 74, 74, 0.5);";
				promptTitle.textContent = "[SLAUGHTER_SEC@CORE]:~$ FETCH_VULN";
				
				const labelId = document.createElement('span');
				labelId.id = 'cve-id';
				labelId.style.cssText = "color: #00ff66; font-weight: 700; background: rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.3); padding: 2px 10px; border-radius: 3px; text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);";
				labelId.textContent = "SYS_INIT";

				const rollBtn = document.createElement('button');
				rollBtn.style.cssText = "background: #1a1a24; border: 1px solid #ff4a4a; color: #ff4a4a; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: bold; padding: 4px 12px; border-radius: 3px; box-shadow: 0 0 5px rgba(255, 74, 74, 0.1); transition: all 0.2s ease;";
				rollBtn.textContent = "EXECUTE_ROLL ↻";
				rollBtn.onclick = manualRoll;
				rollBtn.onmouseover = () => { rollBtn.style.background='#ff4a4a'; rollBtn.style.color='#0a0a0e'; rollBtn.style.boxShadow='0 0 10px #ff4a4a'; };
				rollBtn.onmouseout = () => { rollBtn.style.background='#1a1a24'; rollBtn.style.color='#ff4a4a'; rollBtn.style.boxShadow='none'; };

				contentContainer.appendChild(promptTitle);
				contentContainer.appendChild(labelId);
				contentContainer.appendChild(rollBtn);

				const summaryText = document.createElement('p');
				summaryText.id = 'cve-summary';
				summaryText.style.cssText = "margin: 0; font-size: 12px; color: #88ffaa; line-height: 1.6; min-height: 36px; max-height: 60px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 3px; border: 1px solid rgba(0, 255, 102, 0.1); position: relative; z-index: 2; font-weight: 500;";

				widget.appendChild(contentContainer);
				widget.appendChild(summaryText);
				document.body.appendChild(widget);
			}

			// 2. Self-sufficient indexing selection logic running 100% locally
			function loadRandomCve() {
				const idEl = document.getElementById('cve-id');
				const summaryEl = document.getElementById('cve-summary');
				
				if (idEl) idEl.textContent = "ROLLING...";
				if (summaryEl) summaryEl.textContent = "Querying internal mainframe core arrays...";
				
				// Pick a completely random index item directly out of your 15 arrays above
				const randomCve = cveDataset[Math.floor(Math.random() * cveDataset.length)];

				// Deliver instant rendering with zero network latency or network blocks
				setTimeout(() => {
					if (idEl) idEl.innerHTML = `<a href="https://nist.gov{randomCve.id}" target="_blank" style="color: #00ff66; text-decoration: none; border-bottom: 1px dotted #00ff66;">${randomCve.id}</a>`;
					if (summaryEl) summaryEl.textContent = `> DESCRIPTION: ${randomCve.summary}`;
				}, 200);
			}

			function startAutoCycle() {
				clearInterval(cycleTimer);
				cycleTimer = setInterval(loadRandomCve, 15000);
			}

			function manualRoll() {
				loadRandomCve();
				startAutoCycle();
			}

			// 3. Mount trigger executing once web template environment settles
			window.addEventListener('load', () => {
				buildTerminalWidget();
				loadRandomCve();
				startAutoCycle();
			});
		</script>
	</body>
</html>
