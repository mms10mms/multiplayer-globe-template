<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Slaughter-Sec Matrix</title>
		<!-- Favicon -->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<!-- Primary Meta Tags -->
		<meta name="title" content="Slaughter-Sec Core" />
		<meta name="description" content="Global Threat Mapping and Vulnerability Intelligence." />
		<meta name="theme-color" content="#060608" />

		<link rel="stylesheet" href="/normalize.css" />
		<link rel="stylesheet" href="/dist/index.css" />
	</head>
	<body>
		<!-- Main Homepage Root Container (Holding your 3D canvas map) -->
		<div id="root">Loading application layers...</div>
		<script type="module" src="/dist/index.js"></script>

		<!-- Full-Stack Interface Router and Local Intel Datasets -->
		<script>
			let cycleTimer = null;

			// Localized Cyber Intelligence Library Array Matrix (25 Records)
			const cveDataset = [
				{ id: "CVE-2024-3094", summary: "Malicious code injection discovered in XZ Utils compression utilities, leading to remote execution shell backdoors." },
				{ id: "CVE-2021-44228", summary: "Apache Log4j2 JNDI configurations vulnerable to message lookup substitution attacks permitting remote execution strings." },
				{ id: "CVE-2023-38606", summary: "Apple iOS kernel verification bypass exploit allowing localized processes to execute unauthorized root privileges." },
				{ id: "CVE-2017-0144", summary: "Remote code execution flaw in Microsoft SMBv1 servers, heavily leveraged by WannaCry via EternalBlue mechanisms." },
				{ id: "CVE-2022-22965", summary: "Spring Framework Core feature sets vulnerable to remote data binding injection routines via specific JVM environments." },
				{ id: "CVE-2020-0601", summary: "Windows CryptoAPI spoofing vulnerability allowing attackers to bypass system security validation to trust malicious certificates." },
				{ id: "CVE-2014-0160", summary: "OpenSSL Heartbeat Extension information disclosure flaw permitting unauthenticated memory dumping routines (Heartbleed)." },
				{ id: "CVE-2019-0708", summary: "Remote code execution vulnerability inside Windows Remote Desktop Services (RDS) architecture via pre-auth states (BlueKeep)." },
				{ id: "CVE-2021-34527", summary: "Windows Print Spooler service failure allowing remote code execution via unauthorized driver updates (PrintNightmare)." },
				{ id: "CVE-2020-1472", summary: "Elevation of privilege vulnerability mapping inside Microsoft Netlogon protocol validation parameters (Netlogon Exploitation)." },
				{ id: "CVE-2018-7600", summary: "Drupal core remote code execution vulnerability triggered via improper input sanitation on rendering structures (Drupalgeddon2)." },
				{ id: "CVE-2023-23397", summary: "Microsoft Outlook privilege escalation flaw letting remote actors pass NTLM authentication hashes silently via calendar alerts." },
				{ id: "CVE-2022-26134", summary: "Atlassian Confluence Server unauthenticated OGNL expression injection leading to absolute remote root shell execution." },
				{ id: "CVE-2021-26855", summary: "Microsoft Exchange Server SSRF vulnerability permitting untrusted attackers to bypass proxy parameters (ProxyLogon Core)." },
				{ id: "CVE-2020-5902", summary: "F5 BIG-IP Traffic Management User Interface command execution flaw permitting complete root administrative system compromise." },
				{ id: "CVE-2024-21626", summary: "runc container breakout vulnerability leaking file descriptors, enabling containers to escape isolation limits to the host system." },
				{ id: "CVE-2022-0847", summary: "Linux kernel pipe buffer flag tracking failure enabling overwrite capabilities on protected read-only system files (Dirty Pipe)." },
				{ id: "CVE-2023-44487", summary: "HTTP/2 protocol frame streaming manipulation enabling catastrophic stream multiplexing server resource exhaustion (Rapid Reset DDoS)." },
				{ id: "CVE-2019-11510", summary: "Pulse Connect Secure VPN gateway directory traversal vulnerability exposing active user corporate authentication caches." },
				{ id: "CVE-2021-21972", summary: "VMware vCenter Server plugin parameter handling vulnerability permitting untrusted file upload pathways and shell execution." },
				{ id: "CVE-2023-4966", summary: "Citrix NetScaler ADC data disclosure vector leaking buffer memory frames during active session requests (Citrix Bleed)." },
				{ id: "CVE-2022-30190", summary: "Windows Support Diagnostic Tool (MSDT) remote code execution loop triggered via malicious Office document macros (Follina)." },
				{ id: "CVE-2020-1066", summary: "Microsoft Windows unauthenticated remote code execution flaw in the parsing routines of specific GDI layout components." },
				{ id: "CVE-2023-3519", summary: "Citrix NetScaler Gateway remote code execution vulnerability exploiting buffer allocation limits on unauthenticated appliances." },
				{ id: "CVE-2021-26084", summary: "Atlassian Confluence Server OGNL injection parameters failing evaluation limits, mapping absolute terminal execution paths." }
			];
			// 1. Core Front-End URL Router to handle switching between pages dynamically
			function initializeAppRouter() {
				const currentPath = window.location.pathname;

				// Router Case A: If user path is exactly /dashboard, wipe the home elements and build the page
				if (currentPath === "/dashboard" || currentPath === "/dashboard/") {
					// Hide the main homepage globe rendering layer completely
					const rootHomeNode = document.getElementById('root');
					if (rootHomeNode) rootHomeNode.style.display = 'none';
					
					buildPhysicalDashboardPage();
				} 
				// Router Case B: Default Homepage view configuration
				else {
					buildHomepageWidgets();
					loadRandomCve();
					startAutoCycle();
				}
			}

			// 2. Physical Page Builder for the Dashboard Sub-Page view
			function buildPhysicalDashboardPage() {
				if (document.getElementById('dash-page-container')) return;

				const container = document.createElement('div');
				container.id = 'dash-page-container';
				container.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #060608; color: #39ff14; font-family: 'Courier New', Courier, monospace; padding: 30px; box-sizing: border-box; z-index: 100000; overflow-y: auto;";

				// Dashboard Layout Content
				container.innerHTML = `
					<div style="border: 1px solid #ff4a4a; background: rgba(255, 74, 74, 0.03); padding: 15px 25px; border-radius: 4px; box-shadow: 0 0 15px rgba(255, 74, 74, 0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
						<div>
							<h1 style="color: #ff4a4a; margin: 0; font-size: 1.5rem; letter-spacing: 1px; text-shadow: 0 0 5px rgba(255, 74, 74, 0.4);">SLAUGHTER SEC // HONEYPOT INTELLIGENCE</h1>
							<div style="font-size: 11px; color: #555; margin-top: 3px;">PORT LISTENER: ACTIVE // STANDING BY FOR NETWORK HANDSHAKE METRICS...</div>
						</div>
						<a href="/" style="color: #ff4a4a; text-decoration: none; border: 1px solid #ff4a4a; padding: 6px 14px; border-radius: 4px; font-size: 11px; font-weight: bold; background: rgba(255,74,74,0.05);" onmouseover="this.style.background='#ff4a4a'; this.style.color='#0a0a0f';" onmouseout="this.style.background='rgba(255,74,74,0.05)'; this.style.color='#ff4a4a';">RETURN TO CORE</a>
					</div>

					<div style="background: rgba(20,20,30,0.6); border: 1px dashed rgba(57,255,20,0.2); border-radius: 4px; padding: 40px; text-align: center; margin-top: 15vh;">
						<div style="font-size: 24px; color: #ff4a4a; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 8px rgba(255,74,74,0.2);">[!] ENGINE INITIALIZATION PENDING</div>
						<p style="color: #88ffaa; font-size: 13px; max-width: 600px; margin: 0 auto; line-height: 1.6;">Mainframe endpoint workspace detected. Ready to attach live honeypot log capture arrays. Paste custom backend pipeline socket streaming hooks inside this template container object to populate real-world threat telemetry.</p>
					</div>
				`;

				document.body.appendChild(container);
			}

			// 3. UI Element Builder for the main Homepage HUD layout layers
			function buildHomepageWidgets() {
				if (document.getElementById('cve-widget')) return;

				// Create TOP LEFT Navigation Title Block (Static Non-Clickable Header)
				const topLeftNav = document.createElement('div');
				topLeftNav.style.cssText = "position: fixed; top: 20px; left: 20px; z-index: 9999; font-family: 'Courier New', Courier, monospace;";
				
				const leftHeader = document.createElement('div');
				leftHeader.textContent = "[ACCESS DASHBOARD]";
				leftHeader.style.cssText = "color: #ff4a4a; font-size: 12px; font-weight: bold; background: rgba(255, 74, 74, 0.05); border: 1px solid rgba(255, 74, 74, 0.3); padding: 6px 12px; border-radius: 4px; box-shadow: 0 0 10px rgba(255, 74, 74, 0.1); user-select: none;";
				
				topLeftNav.appendChild(leftHeader);
				document.body.appendChild(topLeftNav);

				// Create TOP RIGHT Navigation Link Container (Clickable Hyperlink Route)
				const topRightNav = document.createElement('div');
				topRightNav.style.cssText = "position: fixed; top: 20px; right: 20px; z-index: 9999; font-family: 'Courier New', Courier, monospace;";
				
				const rightLink = document.createElement('a');
				rightLink.href = "/dashboard"; // Moves the sub-page route trigger over to this button
				rightLink.textContent = "[LIVE INTEL STREAM]";
				rightLink.style.cssText = "color: #ff4a4a; text-decoration: none; font-size: 12px; font-weight: bold; background: rgba(255, 74, 74, 0.05); border: 1px solid rgba(255, 74, 74, 0.3); padding: 6px 12px; border-radius: 4px; box-shadow: 0 0 10px rgba(255, 74, 74, 0.1); transition: all 0.2s ease;";
				rightLink.onmouseover = () => { rightLink.style.background='#ff4a4a'; rightLink.style.color='#0a0a0f'; rightLink.style.boxShadow='0 0 15px #ff4a4a'; rightLink.style.borderColor='#ff4a4a'; };
				rightLink.onmouseout = () => { rightLink.style.background='rgba(255, 74, 74, 0.05)'; rightLink.style.color='#ff4a4a'; rightLink.style.boxShadow='0 0 10px rgba(255, 74, 74, 0.1)'; rightLink.style.borderColor='rgba(255, 74, 74, 0.3)'; };
				
				topRightNav.appendChild(rightLink);
				document.body.appendChild(topRightNav);

				// Bottom CVE Widget Box Layout Container (Tactical Cyan Border / Green Text)
				const widget = document.createElement('div');
				widget.id = 'cve-widget';
				widget.style.cssText = "position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); padding: 15px 25px; background: rgba(10, 10, 15, 0.95); color: #39ff14; text-align: center; font-family: 'Courier New', Courier, monospace; font-size: 13px; border: 1px solid #00f0ff; border-radius: 4px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 0 10px rgba(57, 255, 20, 0.03); width: 90%; max-width: 900px; z-index: 9999; backdrop-filter: blur(4px);";

				const scanline = document.createElement('div');
				scanline.style.cssText = "position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(0, 240, 255, 0.03), rgba(57, 255, 20, 0.01), rgba(0, 240, 255, 0.03)); background-size: 100% 4px, 6px 100%; pointer-events: none; opacity: 0.4;";
				widget.appendChild(scanline);

				const contentContainer = document.createElement('div');
				contentContainer.style.cssText = "margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 2;";
				
				const promptTitle = document.createElement('strong');
				promptTitle.style.cssText = "letter-spacing: 1px; color: #00f0ff; text-shadow: 0 0 5px rgba(0, 240, 255, 0.4);";
				promptTitle.textContent = "[SLAUGHTER SEC@CORE]:~$ FETCH_VULN";
				
				const labelId = document.createElement('span');
				labelId.id = 'cve-id';
				labelId.style.cssText = "color: #39ff14; font-weight: 700; background: rgba(57, 255, 20, 0.08); border: 1px solid rgba(57, 255, 20, 0.2); padding: 2px 10px; border-radius: 3px; text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);";
				labelId.textContent = "SYS_INIT";

				const rollBtn = document.createElement('button');
				rollBtn.style.cssText = "background: #14141f; border: 1px solid #00f0ff; color: #00f0ff; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: bold; padding: 4px 12px; border-radius: 3px; box-shadow: 0 0 5px rgba(0, 240, 255, 0.1); transition: all 0.2s ease;";
				rollBtn.textContent = "EXECUTE_ROLL ↻";
				rollBtn.onclick = manualRoll;
				rollBtn.onmouseover = () => { rollBtn.style.background='#00f0ff'; rollBtn.style.color='#0a0a0f'; rollBtn.style.boxShadow='0 0 10px #00f0ff'; };
				rollBtn.onmouseout = () => { rollBtn.style.background='#14141f'; rollBtn.style.color='#00f0ff'; rollBtn.style.boxShadow='none'; };

				contentContainer.appendChild(promptTitle);
				contentContainer.appendChild(labelId);
				contentContainer.appendChild(rollBtn);

				const summaryText = document.createElement('p');
				summaryText.id = 'cve-summary';
				summaryText.style.cssText = "margin: 0; font-size: 12px; color: #88ffaa; line-height: 1.6; min-height: 36px; max-height: 60px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 3px; border: 1px solid rgba(0, 240, 255, 0.1); position: relative; z-index: 2; font-weight: 500;";

				widget.appendChild(contentContainer);
				widget.appendChild(summaryText);
				document.body.appendChild(widget);
			}

			// 4. Local Ticker Handler
			function loadRandomCve() {
				const idEl = document.getElementById('cve-id');
				const summaryEl = document.getElementById('cve-summary');
				if (idEl) idEl.textContent = "ROLLING...";
				
				const randomCve = cveDataset[Math.floor(Math.random() * cveDataset.length)];
				setTimeout(() => {
					if (idEl) idEl.innerHTML = `<a href="https://nist.gov{randomCve.id}" target="_blank" style="color: #39ff14; text-decoration: none; border-bottom: 1px dotted #39ff14;">${randomCve.id}</a>`;
					if (summaryEl) summaryEl.textContent = `> DESCRIPTION: ${randomCve.summary}`;
				}, 200);
			}

			function startAutoCycle() {
				clearInterval(cycleTimer);
				cycleTimer = setInterval(loadRandomCve, 15000);
			}

			function manualRoll() {
				loadRandomCve();
				startAutoCycle();
			}

			// 5. Fire App Router the absolute millisecond page environment loads
			window.addEventListener('load', initializeAppRouter);
		</script>
	</body>
</html>
